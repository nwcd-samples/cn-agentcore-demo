AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  agentcore-cn P0-a 基础设施:DynamoDB / S3 / ECR / IAM。
  目标区域 cn-northwest-1(分区 aws-cn)。所有 ARN 一律用 AWS::Partition 拼,
  不要硬编码 "aws",否则在中国区全线失败。

Parameters:
  Project:
    Type: String
    Default: agentcore-cn
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
    Description: 资源名前缀

Resources:

  # ------------------------------------------------------------------
  # 存储
  # ------------------------------------------------------------------

  ArtifactBucket:
    Type: AWS::S3::Bucket
    # demo 用:删栈时一并删除。生产请改 Retain。
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${Project}-artifacts-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Code Interpreter 产出的图表/自检报告属于临时产物
          - Id: expire-demo-outputs
            Status: Enabled
            Prefix: outputs/
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # 鉴权表:USER# / CLIENT# / REFRESH# / JTI# 四类条目共用
  AuthTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${Project}-auth'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        # refresh token / jti 吊销记录到期自动清理
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # 业务表:ORDER# / TICKET# / SHIPMENT#
  BusinessTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${Project}-business'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # 按客户查订单、按状态查工单
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  # MemoryLite:中国区没有 AgentCore Memory,用这张表补位
  MemoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${Project}-memory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        # 短期记忆(会话内对话)到期自动过期;长期记忆不写这个字段
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ------------------------------------------------------------------
  # 镜像仓库
  # ------------------------------------------------------------------

  AgentRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub '${Project}/agent'
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "只保留最近 10 个镜像",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ------------------------------------------------------------------
  # AgentCore Runtime 执行角色
  # ------------------------------------------------------------------

  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-runtime-exec'
      # IAM Role Description 只接受 ASCII/Latin-1,不能写中文
      Description: Execution role for the AgentCore Runtime container
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # 服务主体在中国区不带 .cn 后缀
              Service: bedrock-agentcore.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
      Policies:

        - PolicyName: ecr-pull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchCheckLayerAvailability'
                Resource: !GetAtt AgentRepository.Arn
              - Effect: Allow
                Action: 'ecr:GetAuthorizationToken'
                Resource: '*'

        - PolicyName: observability
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                  - 'logs:DescribeLogGroups'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*'
              - Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                  - 'xray:GetSamplingRules'
                  - 'xray:GetSamplingTargets'
                Resource: '*'
              - Effect: Allow
                Action: 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': 'bedrock-agentcore'

        - PolicyName: agentcore-identity-and-tools
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Workload identity:换取 workload access token
              - Effect: Allow
                Action:
                  - 'bedrock-agentcore:GetWorkloadAccessToken'
                  - 'bedrock-agentcore:GetWorkloadAccessTokenForJWT'
                  - 'bedrock-agentcore:GetWorkloadAccessTokenForUserId'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*'
              # 出向凭证:DeepSeek API Key + 自建 IdP 的 OAuth2 token
              #
              # 【实测纠正】这两个 action 的授权资源【不是 token vault】,
              # 而是调用方的 workload identity。cn-northwest-1 实测报错原文:
              #   not authorized to perform: bedrock-agentcore:GetResourceApiKey
              #   on resource: .../workload-identity-directory/default/
              #                workload-identity/<runtime-name>
              # 只授 token-vault 会让所有出向凭证获取全部 AccessDenied,
              # 症状是 Identity / 模型 / Gateway 三项同时失败。
              # token-vault 一并保留 —— credential provider 本身挂在它下面。
              - Effect: Allow
                Action:
                  - 'bedrock-agentcore:GetResourceApiKey'
                  - 'bedrock-agentcore:GetResourceOauth2Token'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/*'
              # 【实测纠正之二】GetResourceApiKey / GetResourceOauth2Token 并【不是】
              # 由 AgentCore 代为解密后把明文返回 —— 容器还要自己去
              # Secrets Manager 读那条托管密文。少了这条权限,上面两个 action
              # 通过了,却在下一步拿到
              #   secretsmanager:GetSecretValue on resource:
              #   ...secret:bedrock-agentcore-identity!default/apikey/<provider>-xxx
              # 密文名固定以 "bedrock-agentcore-identity!" 开头(AgentCore 托管),
              # 所以按这个前缀收敛,不开放整个 Secrets Manager。
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!*'
              # Code Interpreter 沙箱
              - Effect: Allow
                Action:
                  - 'bedrock-agentcore:StartCodeInterpreterSession'
                  - 'bedrock-agentcore:InvokeCodeInterpreter'
                  - 'bedrock-agentcore:StopCodeInterpreterSession'
                  - 'bedrock-agentcore:GetCodeInterpreterSession'
                  - 'bedrock-agentcore:ListCodeInterpreterSessions'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:code-interpreter/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:code-interpreter-custom/*'
              # Browser 沙箱
              - Effect: Allow
                Action:
                  - 'bedrock-agentcore:StartBrowserSession'
                  - 'bedrock-agentcore:StopBrowserSession'
                  - 'bedrock-agentcore:GetBrowserSession'
                  - 'bedrock-agentcore:ListBrowserSessions'
                  - 'bedrock-agentcore:ConnectBrowserAutomationStream'
                  - 'bedrock-agentcore:ConnectBrowserLiveViewStream'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:browser/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:browser-custom/*'
              # Gateway:MCP 工具调用
              - Effect: Allow
                Action:
                  - 'bedrock-agentcore:InvokeGateway'
                  - 'bedrock-agentcore:ListGatewayTargets'
                  - 'bedrock-agentcore:GetGateway'
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*'

        - PolicyName: app-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:BatchGetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:UpdateItem'
                  - 'dynamodb:DeleteItem'
                Resource:
                  - !GetAtt MemoryTable.Arn
                  - !Sub '${MemoryTable.Arn}/index/*'
                  - !GetAtt BusinessTable.Arn
                  - !Sub '${BusinessTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/outputs/*'

  # ------------------------------------------------------------------
  # AgentCore Gateway 执行角色(Gateway 调 target 用)
  # ------------------------------------------------------------------

  GatewayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-gateway-exec'
      Description: Role assumed by AgentCore Gateway to invoke Lambda / OpenAPI targets
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*'
      Policies:
        - PolicyName: invoke-targets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # 业务工具 Lambda 由 20-business-tools.yaml 创建,这里按命名前缀授权
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Project}-*'
              # OpenAPI target 的出向凭证(自建 IdP 的 client_credentials)
              - Effect: Allow
                Action:
                  - 'bedrock-agentcore:GetResourceOauth2Token'
                  - 'bedrock-agentcore:GetResourceApiKey'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/*'
        - PolicyName: gateway-observability
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/gateways/*'

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub '${Project}-artifact-bucket'
  AuthTableName:
    Value: !Ref AuthTable
    Export:
      Name: !Sub '${Project}-auth-table'
  AuthTableArn:
    Value: !GetAtt AuthTable.Arn
    Export:
      Name: !Sub '${Project}-auth-table-arn'
  BusinessTableName:
    Value: !Ref BusinessTable
    Export:
      Name: !Sub '${Project}-business-table'
  BusinessTableArn:
    Value: !GetAtt BusinessTable.Arn
    Export:
      Name: !Sub '${Project}-business-table-arn'
  MemoryTableName:
    Value: !Ref MemoryTable
    Export:
      Name: !Sub '${Project}-memory-table'
  AgentRepositoryUri:
    Value: !GetAtt AgentRepository.RepositoryUri
    Export:
      Name: !Sub '${Project}-agent-repo-uri'
  RuntimeExecutionRoleArn:
    Value: !GetAtt RuntimeExecutionRole.Arn
    Export:
      Name: !Sub '${Project}-runtime-role-arn'
  GatewayExecutionRoleArn:
    Value: !GetAtt GatewayExecutionRole.Arn
    Export:
      Name: !Sub '${Project}-gateway-role-arn'
